# i8086 datasheet limits — single source of truth for every layer.
# Owner: Spec & Integration lead. Design doc §3.1; values from the reference brief.
# libs/spec validates this file strictly at load time (unknown keys, missing provenance,
# bad expressions and min > max are all errors with file:line).
# Provenance: every entry carries `ref`; values from the brief marked "(verify)"
# carry `verified: false` until task X1 checks them against Intel DS 231455-006.
schema_version: 1

device: { name: i8086, package: DIP40, ref: "DS §Pin Configuration", verified: true }

grades:
  "8086":   { fclk_max_mhz: 5,  tclcl_ns: [200, 500], ref: "DS §A.C.", verified: true }
  "8086-2": { fclk_max_mhz: 8,  tclcl_ns: [125, 500], ref: "DS §A.C.", verified: true }
  "8086-1": { fclk_max_mhz: 10, tclcl_ns: [100, 500], ref: "DS §A.C.", verified: false }

# Brief §3.1/§3.2. Names are minimum-mode names; `_N` = active low.
pins:
  - { num: 1,  name: GND,    dir: pwr, ref: "DS §Pin Description", verified: true }
  - { num: 2,  name: AD14,   dir: io,  tristate: true, bus: AD, bit: 14, ref: "DS §Pin Description", verified: true }
  - { num: 3,  name: AD13,   dir: io,  tristate: true, bus: AD, bit: 13, ref: "DS §Pin Description", verified: true }
  - { num: 4,  name: AD12,   dir: io,  tristate: true, bus: AD, bit: 12, ref: "DS §Pin Description", verified: true }
  - { num: 5,  name: AD11,   dir: io,  tristate: true, bus: AD, bit: 11, ref: "DS §Pin Description", verified: true }
  - { num: 6,  name: AD10,   dir: io,  tristate: true, bus: AD, bit: 10, ref: "DS §Pin Description", verified: true }
  - { num: 7,  name: AD9,    dir: io,  tristate: true, bus: AD, bit: 9,  ref: "DS §Pin Description", verified: true }
  - { num: 8,  name: AD8,    dir: io,  tristate: true, bus: AD, bit: 8,  ref: "DS §Pin Description", verified: true }
  - { num: 9,  name: AD7,    dir: io,  tristate: true, bus: AD, bit: 7,  ref: "DS §Pin Description", verified: true }
  - { num: 10, name: AD6,    dir: io,  tristate: true, bus: AD, bit: 6,  ref: "DS §Pin Description", verified: true }
  - { num: 11, name: AD5,    dir: io,  tristate: true, bus: AD, bit: 5,  ref: "DS §Pin Description", verified: true }
  - { num: 12, name: AD4,    dir: io,  tristate: true, bus: AD, bit: 4,  ref: "DS §Pin Description", verified: true }
  - { num: 13, name: AD3,    dir: io,  tristate: true, bus: AD, bit: 3,  ref: "DS §Pin Description", verified: true }
  - { num: 14, name: AD2,    dir: io,  tristate: true, bus: AD, bit: 2,  ref: "DS §Pin Description", verified: true }
  - { num: 15, name: AD1,    dir: io,  tristate: true, bus: AD, bit: 1,  ref: "DS §Pin Description", verified: true }
  - { num: 16, name: AD0,    dir: io,  tristate: true, bus: AD, bit: 0,  ref: "DS §Pin Description", verified: true }
  - { num: 17, name: NMI,    dir: in,  ref: "DS §Pin Description", verified: true }
  - { num: 18, name: INTR,   dir: in,  ref: "DS §Pin Description", verified: true }
  - { num: 19, name: CLK,    dir: in,  ref: "DS §Pin Description", verified: true }
  - { num: 20, name: GND2,   dir: pwr, ref: "DS §Pin Description", verified: true }
  - { num: 21, name: RESET,  dir: in,  ref: "DS §Pin Description", verified: true }
  - { num: 22, name: READY,  dir: in,  ref: "DS §Pin Description", verified: true }
  - { num: 23, name: TEST_N, dir: in,  active_low: true, ref: "DS §Pin Description", verified: true }
