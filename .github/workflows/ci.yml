name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:  # run on any branch by hand, e.g. to warm the compiler cache before a demo

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regress:
    name: ./regress
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install NASM and ccache
        run: sudo apt-get update && sudo apt-get install -y nasm ccache

      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-regress-${{ github.sha }}
          restore-keys: ccache-regress-

      - name: Regression
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 500M
        run: ./regress

      - name: Upload out/
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-out
          path: out/
          if-no-files-found: ignore

      - name: Job summary
        if: always()
        run: |
          if [ -f out/summary.md ]; then cat out/summary.md >> "$GITHUB_STEP_SUMMARY"; fi

  asan:
    name: unit tests (ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM and ccache
        run: sudo apt-get update && sudo apt-get install -y nasm ccache
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-asan-${{ github.sha }}
          restore-keys: ccache-asan-
      - name: Configure, build, test
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 500M
        run: |
          cmake --preset asan
          cmake --build --preset asan -j "$(nproc)"
          ctest --preset asan -j "$(nproc)"
